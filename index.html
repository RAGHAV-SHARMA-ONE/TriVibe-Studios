<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriVibe Studios | Cinematic Universe</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Theme Variables */
        :root {
            --bg-color: #050505;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --yt-color: #FF0000;
            --ig-color: #E1306C;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1a0b2e 0%, transparent 50%);
        }

        /* Navbar */
        nav {
            padding: 15px 40px;
            text-align: center;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Main Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Banner Image */
        .banner-wrapper {
            width: 100%;
            margin-bottom: 30px;
            border-radius: 20px;
            padding: 3px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            box-shadow: 0 0 30px rgba(188, 19, 254, 0.4), 0 0 50px rgba(0, 243, 255, 0.2);
        }

        .banner-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 17px;
            object-fit: cover;
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 5px;
            text-align: center;
            letter-spacing: 2px;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
        }

        /* GUARANTEED BUTTONS CSS */
        .social-buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 60px;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 35px;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            color: white;
            border-radius: 50px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .btn-yt {
            background-color: rgba(255, 0, 0, 0.1);
            border: 2px solid var(--yt-color);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }

        .btn-yt:hover {
            background-color: var(--yt-color);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            transform: translateY(-5px);
        }

        .btn-ig {
            background-color: rgba(225, 48, 108, 0.1);
            border: 2px solid var(--ig-color);
            box-shadow: 0 0 15px rgba(225, 48, 108, 0.3);
        }

        .btn-ig:hover {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            border-color: transparent;
            box-shadow: 0 0 30px rgba(225, 48, 108, 0.8);
            transform: translateY(-5px);
        }

        /* Video Section */
        .video-section {
            width: 100%;
            text-align: center;
            margin-bottom: 50px;
        }

        .video-section h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .video-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        video {
            width: 100%;
            display: block;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #000;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .social-buttons { flex-direction: column; width: 100%; padding: 0 20px; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

        <div class="logo">TriVibe Studios</div>
    </nav>

        <div class="video-section">
            <h2>Cinematic Intro</h2>
            <div class="video-container">
                <video controls autoplay loop muted>
                    <source src="Timeline.mp4" type="video/mp4">
                </video>
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 TriVibe Studios. All Rights Reserved.</p>
    </footer>

</body>
</html>
